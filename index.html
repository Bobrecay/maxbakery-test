<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Max Bakery – Pre-order</title>
<style>
:root{--bg:#f6ecdd;--paper:#fbf4ea;--card:#fffaf3;--m:#6b1a1a;--dm:#4a0e0e;--g:#c9a84c;--g2:#f1e2b5;--ink:#2c1810;--mu:#7a6254;--line:#eadcc6;--open:#2f6b3f;--fill:#b8860b;--almost:#b0402c;--full:#9a948c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#e9dcc6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px}
.serif{font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer;color:inherit}
.app{position:relative;max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:110px;box-shadow:0 0 40px #3a200f33}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.top h2{margin:0;flex:1;text-align:center;font-size:19px;font-family:Georgia,serif;color:var(--dm)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center;position:relative;flex:none}
.ib .bd{position:absolute;top:-4px;right:-4px;background:var(--m);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.lang{display:flex;gap:4px;flex:none}.lang button{border:1px solid var(--g);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.lang button.on{background:var(--g);color:var(--dm)}
.chk2{margin:0 16px 10px;font-size:13px;color:var(--open);font-weight:600}.gone{margin:0 16px 10px;background:#fdecdc;border:1px solid #f0c9a4;border-radius:12px;padding:9px 13px;font-size:13px;color:#6a3a1b}
.steps{display:flex;gap:5px;padding:0 20px 10px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--m)}
.hero{margin:6px 16px 0;border-radius:22px;overflow:hidden;position:relative;color:#fff;min-height:150px;background:#3a1a10}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero div{position:relative;padding:22px 20px;max-width:75%}
.hero h1{font:700 27px/1.15 Georgia,serif;margin:0 0 6px}
.hero p{margin:0;font-size:14px;opacity:.95}
.banner{margin:12px 16px 0;background:#fff3d6;border:1px solid var(--g);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mu)}
.banner b{display:block;color:var(--ink);font-size:14px}
.note{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mu)}
.note b{color:var(--ink)}
.sec{margin:20px 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec h3{margin:0;font:700 19px Georgia,serif;color:var(--dm)}.sec small{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;padding:0;text-align:left;width:100%;font:inherit;color:inherit;transition:transform .08s}
.pc:active{transform:scale(.98)}
.pc.has{border-color:var(--m);box-shadow:0 0 0 1px var(--m)}
.pc .imw{position:relative;aspect-ratio:4/3;background:#efe2c8}.pc .imw img{width:100%;height:100%;object-fit:cover;display:block}
.pc .qb{position:absolute;top:8px;right:8px;min-width:28px;height:28px;border-radius:999px;background:var(--m);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;padding:0 8px;box-shadow:0 2px 6px #0004}
.pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.pc h4{margin:0;font-size:15px;line-height:1.25;min-height:2.5em}
.pc .pr{color:var(--mu);font-size:13px;margin-top:2px}.pc .pr b{color:var(--ink)}
.pc .opt{display:none;font-size:11.5px;line-height:1.3;color:var(--mu);margin-top:1px;min-height:15px}
.grid.hasopt .opt{display:block}
@media(max-width:400px){.grid.hasopt .opt{min-height:30px}}
.pc .meta{font-size:11px;line-height:1.3;font-weight:600;color:var(--almost);margin-top:5px}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--m);border-radius:999px;padding:3px;color:#fff}
.stp button{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--m);font-size:20px;line-height:1;padding:0}
.stp b{font-size:16px;min-width:24px;text-align:center}
.stp input{width:44px;border:0;background:transparent;text-align:center;font-family:inherit;font-weight:700;font-size:16px;color:inherit;padding:0;-moz-appearance:textfield;min-width:0}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.line .stp input{width:30px}
.stp.lt{background:#f3e6cf;color:var(--ink)}
.dimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#efe2c8}
.dbody{padding:16px}.dbody h2{margin:0 0 2px;font:700 25px Georgia,serif;color:var(--dm)}.dbody .zh{color:var(--mu);margin-bottom:10px}
.info{display:flex;gap:10px;background:#fdecdc;border:1px solid #f0c9a4;border-radius:14px;padding:11px 13px;font-size:13px;margin:12px 0;color:#6a3a1b}
.info b{display:block;color:#4a2208}
.info.ok{background:#eef6ea;border-color:#c9dfc1;color:#34542b}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}.vrow .l{font-size:16px}.vrow .l b{display:block;font-size:17px}
.vrow .stp{width:132px}
.line{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.line img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.line .t{flex:1;min-width:0}.line .t b{display:block;font-size:15px}.line .t span{color:var(--mu);font-size:13px}
.line .stp{width:112px;padding:2px}.line .stp button{width:28px;height:28px;font-size:17px}
.line .lp{font-weight:700;width:56px;text-align:right}
.box{margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.row.tot{border-top:1px dashed #cdb98c;margin-top:6px;padding-top:10px;font-size:19px;font-weight:700;color:var(--dm)}
.good{color:var(--open);font-weight:600;font-size:13px}
.fine{color:var(--mu);font-size:12px;margin-top:8px;line-height:1.45}
.empty{text-align:center;color:var(--mu);padding:46px 24px}.empty .e{font-size:44px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.dc{flex:none;width:58px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0;text-align:center}
.dc small{display:block;color:var(--mu);font-size:12px}.dc b{font-size:20px;font-family:Georgia,serif;color:var(--dm)}
.dc.sel{background:var(--m);border-color:var(--m)}.dc.sel *{color:#fff}
.dc.x{background:#efe9dc;opacity:.65}.dc.x b{color:#999}
.slots{padding:4px 16px;display:flex;flex-direction:column;gap:9px}
.sl{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:13px 15px;text-align:left;width:100%}
.sl b{font-size:16px}
.sl.sel{border-color:var(--m);background:#fbe9e1}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;display:flex;align-items:center;gap:6px}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.st.open{color:var(--open);background:#e3f1e6}.st.filling{color:var(--fill);background:#fbf0d2}.st.almost{color:var(--almost);background:#f9e1db}.st.full{color:#6f6a63;background:#ebe7e0}
.sl.full b{color:#8a847b}.sl .why{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.fld{display:block;margin:0 16px 12px}.fld span{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:5px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid #dccdac;border-radius:13px;background:#fff;color:var(--ink)}
.fld textarea{resize:none}.fld.bad input{border-color:var(--almost);background:#fff5f3}.fld em{display:none;color:var(--almost);font-size:12px;font-style:normal}.fld.bad em{display:block}
.chk{display:flex;gap:10px;align-items:flex-start;margin:0 16px 12px;font-size:14px;color:var(--mu)}.chk input{width:20px;height:20px;accent-color:var(--m);margin-top:1px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px}.pk a{color:var(--m);font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer}
.dock{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(#fbf4ea00,#fbf4ea 28%);display:flex;gap:10px;z-index:10}
.dock:empty{display:none}
.dock.col{flex-direction:column;gap:8px}
.dock2{display:flex;gap:10px}
.dock2 .cta{padding:12px 14px;font-size:15px}
.cta{flex:1;border:0;border-radius:999px;background:var(--m);color:#fff;font-weight:700;font-size:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 16px #6b1a1a40}
.cta span{white-space:nowrap}
.cta[disabled]{background:#cdbfae;box-shadow:none}.cta.c{justify-content:center}
.cta.ghost{background:#fff;color:var(--m);border:1.5px solid var(--m);box-shadow:none}
.cta.danger{background:#fff;color:var(--almost);border:1.5px solid var(--almost);box-shadow:none}
.done{text-align:center;padding:30px 22px 6px}.done .ck{width:84px;height:84px;border-radius:50%;background:var(--m);color:#fff;display:grid;place-items:center;font-size:42px;margin:0 auto 14px;box-shadow:0 0 0 10px #6b1a1a14}
.done h2{margin:0 0 6px;font:700 28px Georgia,serif;color:var(--dm)}.done p{color:var(--mu);margin:0 0 4px}
.load{text-align:center;color:var(--mu);padding:30px 20px;font-size:14px}
:is(html,body):has(.wt,.ov){overflow:hidden}
.wt,.ov{touch-action:none;overscroll-behavior:contain}.ov .md{touch-action:pan-y}
.wt{position:fixed;inset:0;background:#2c181099;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.wt .md{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 28px;width:auto;min-width:220px}
.wt .sp{width:34px;height:34px;border:4px solid #e6dcc0;border-top-color:var(--m);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:#2c181099;display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.md{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:86vh;overflow:auto;box-shadow:0 12px 40px #0006}
.md h3{margin:0 0 8px;font:700 21px Georgia,serif;color:var(--dm)}.md p{margin:0 0 8px;color:var(--ink);line-height:1.45}
.md .bt{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.md .bt button{border:0;border-radius:999px;background:var(--m);color:#fff;font-weight:700;padding:13px;font-size:15px}.md .bt button.g{background:#fff;color:var(--m);border:1.5px solid var(--m)}
.md .sg{display:flex;justify-content:space-between;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;font-weight:600;margin-top:6px}
.sugbox{margin:4px 16px 10px;background:#eef6ea;border:1px solid #c9dfc1;border-radius:14px;padding:11px 13px}
.sugbox b{display:block;font-size:13px;color:#34542b;margin-bottom:8px}
.sgs{display:flex;flex-wrap:wrap;gap:8px}
.sgp{border:1.5px solid var(--open);background:#fff;color:var(--open);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px}
</style>
</head>

/* ===================== STATE & HELPERS ===================== */
const st = { cfg: DEFAULT_CFG, week: null, lang: 'en', screen: 'menu', detail: null, q: {}, date: null, slot: null,
  name: '', email: '', phone: '', notes: '', reminder: false, bad: {}, flash: '', gone: false,
  draft: {}, mode: 'new', token: null, order: null, checking: false, busy: false, result: null };
const t = (k, v) => { let s = (S[st.lang][k] ?? S.en[k] ?? k); if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);
const phoneNo = () => st.cfg.settings.phone;
const opts = () => st.cfg.options;
const optBy = n => opts().find(o => o.name === n);
const capNames = () => { const out = []; opts().forEach(o => { if (out.indexOf(o.capItem) < 0) out.push(o.capItem); }); return out; };   // menu order = row order in Item Info
const optsOf = c => opts().filter(o => o.capItem === c);
const zhName = o => (o.zh || o.name).split(' - ')[0];
const iName = c => { const o = optsOf(c)[0]; return st.lang === 'zh' && o ? zhName(o) : c; };
const vLabel = o => { const p = o.name.split(' - '); if (p.length < 2) return ''; const v = p[1].toLowerCase(); return v === 'dozen' ? t('dozen') : v === 'half' ? t('half') : v === 'whole' ? t('whole') : p[1]; };
const sectionOf = c => { const o = optsOf(c)[0]; if (/loaf/i.test(c)) return 'Loaves'; return o && o.regular ? 'Buns' : 'Dinner'; };
const cutOf = c => optsOf(c).find(o => o.cutoffMin != null);
const imgSrc = o => 'images/' + o.image + '.webp';
const qty = n => st.q[n] || 0;
const setQ = (n, v) => { v = Math.max(0, v); if (v === 0) delete st.q[n]; else st.q[n] = v; };
const cartQty = () => { const c = {}; opts().forEach(o => { if (qty(o.name) > 0) c[o.name] = qty(o.name); }); return c; };
const totalCount = () => opts().reduce((s, o) => s + qty(o.name), 0);
const unitsByCap = cart => { const u = {}; opts().forEach(o => { const q = cart[o.name] || 0; if (q > 0) u[o.capItem] = (u[o.capItem] || 0) + q * o.units; }); return u; };
const loafUnits = cart => opts().reduce((s, o) => s + (o.loaf ? (cart[o.name] || 0) * o.units : 0), 0);
function price(cart) {
  const S0 = st.cfg.settings; let reg = 0;
  opts().forEach(o => { if (o.regular) reg += cart[o.name] || 0; });
  const disc = reg >= S0.discountMinQty; let total = 0; const lines = [];
  opts().forEach(o => { const q = cart[o.name] || 0; if (q <= 0) return; const unit = o.regular && disc ? S0.discountPrice : o.cost; total += unit * q; lines.push({ o, q, unit, line: unit * q }); });
  return { total: Math.round(total * 100) / 100, disc, lines };
}
const cutoffTime = () => { const o = opts().find(x => x.cutoffMin != null); return o ? o.cutoffText : '9:30 PM'; };
const earlyCaps = () => { const s = []; opts().forEach(o => { if (o.cutoffMin != null && s.indexOf(o.capItem) < 0) s.push(o.capItem); }); return s; };
const taxNote = () => (st.cfg.taxNote || {})[st.lang] || '';

/* ---------- dates ---------- */
function daysList() {
  if (st.week) return st.week.days;
  const out = [], b = new Date(); b.setHours(0, 0, 0, 0);
  for (let i = 1; i <= (st.cfg.settings.daysShown || 7); i++) {
    const d = new Date(b); d.setDate(b.getDate() + i);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    out.push({ date: k, closed: (st.cfg.settings.closedWeekdays || [2]).indexOf(d.getDay()) !== -1, slots: [], locked: [] });
  }
  return out;
}
const dayData = k => daysList().find(d => d.date === k);
const slotData = (k, l) => { const d = dayData(k); return d && d.slots ? d.slots.find(s => s.slot === l) : null; };
const dObj = k => new Date(k + 'T12:00:00');
const locale = () => st.lang === 'zh' ? 'zh-HK' : 'en-CA';
const fmtDow = k => dObj(k).toLocaleDateString(locale(), { weekday: 'short' });
const fmtMon = k => dObj(k).toLocaleDateString(locale(), { month: 'short', day: 'numeric' });
const fmtLong = k => dObj(k).toLocaleDateString(locale(), { weekday: 'long', month: 'long', day: 'numeric' });
const slotStart = l => l.split(' - ')[0];
const slotLabel = l => l.replace(/ - /, ' – ');
const pickTxt = () => st.date && st.slot ? fmtLong(st.date) + ' · ' + slotLabel(st.slot) : '';
function msToMidnight() {
  const p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Toronto', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date()).forEach(x => { p[x.type] = +x.value; });
  return 86400000 - (((p.hour % 24) * 60 + p.minute) * 60 + p.second) * 1000;
}
function bannerHtml() {
  const ms = msToMidnight(), h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return `<div class="banner" id="cdBanner"><b>⏰ ${esc(t('left', { t: h + t('h') + ' ' + m + t('m') }))}</b>${esc(t('leftSub'))}</div>`;
}
setInterval(() => { const b = $('cdBanner'); if (b) b.outerHTML = bannerHtml(); }, 30000);

/* ---------- availability (cart-aware) ---------- */
const EPS = 1e-9;
function lockedCaps(d) {   // items in this order that can't be ordered for that day any more (past the 9:30 PM cutoff)
  const out = [];
  (d.locked || []).forEach(n => {
    const o = optBy(n), q = qty(n); if (!o || q <= 0) return;
    if (st.mode === 'manage' && st.order && d.date === st.order.pickupDate && q === (st.order.items[n] || 0)) return;   // unchanged item in an existing order
    if (out.indexOf(o.capItem) < 0) out.push(o.capItem);
  });
  return out;
}
function misfitsOf(d, sd, units) {
  const lc = lockedCaps(d);
  return Object.keys(units).filter(c => lc.indexOf(c) >= 0 || !(sd.items[c] && units[c] <= sd.items[c].remaining + EPS));
}
// Status as seen by THIS customer: checked against everything in their order.
function statusOf(d, sd) {
  const units = unitsByCap(cartQty()), cs = Object.keys(units);
  if (!cs.length) return sd.status;
  const mf = misfitsOf(d, sd, units);
  if (mf.length > cs.length / 2) return 'full';
  if (mf.length) return 'almost';
  const r = Math.max(...cs.map(c => { const it = sd.items[c]; return it && it.cap ? (it.cap - it.remaining + units[c]) / it.cap : 1; }));
  return r >= 0.85 ? 'almost' : r >= 0.6 ? 'filling' : 'open';
}
function maxCap(cap) { let m = 0; daysList().forEach(d => (d.slots || []).forEach(s => { if (s.items && s.items[cap]) m = Math.max(m, s.items[cap].cap); })); return m; }
const startMin = l => { const m = /(\d+):(\d+) (AM|PM)/.exec(slotStart(l)); let h = +m[1] % 12; if (m[3] === 'PM') h += 12; return h * 60 + +m[2]; };
const PREFER_FROM = 17 * 60;   // Max is quietest from 5 PM, so suggestions steer people to 5 PM or later
// Times where the WHOLE order fits. Later times (5 PM+) come first, same day before other days; anything earlier only if nothing late fits.
function suggest(units, fromDate, fromSlot, max) {
  max = max || 3; const cs = Object.keys(units).length;
  const lockedAll = st.mode === 'manage' && st.order && (st.order.lockedOptions || []).some(n => (st.order.items[n] || 0) > 0);
  const days = daysList().filter(d => !d.closed && d.slots && d.slots.length && !(lockedAll && d.date !== st.order.pickupDate));
  days.sort((a, b) => (a.date === fromDate ? -1 : b.date === fromDate ? 1 : a.date < b.date ? -1 : 1));
  const c = [];
  days.forEach((d, di) => d.slots.forEach(s => {
    if (d.date === fromDate && s.slot === fromSlot) return;
    if (misfitsOf(d, s, units).length || (!cs && s.status === 'full')) return;
    const m = startMin(s.slot); c.push({ d, s, di, m, pref: m >= PREFER_FROM ? 0 : 1 });
  }));
  c.sort((a, b) => a.pref - b.pref || a.di - b.di || a.m - b.m);
  return c.slice(0, max).map(x => ({ date: x.d.date, slot: x.s.slot, label: fmtDow(x.d.date) + ' ' + fmtMon(x.d.date) + ' · ' + slotStart(x.s.slot) }));
}

/* ===================== NETWORK ===================== */
const SAFE = ['getFormConfig', 'getWeekAvailability', 'getOrderForCancel', 'checkOrderExists'];
async function fetchOnce(body, ms) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal }); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function call(action, payload, ms) {
  const body = Object.assign({ action }, payload || {});
  try { return await fetchOnce(body, ms || 25000); }
  catch (e) {
    if (SAFE.indexOf(action) !== -1) { try { return await fetchOnce(body, ms || 25000); } catch (e2) { /* fall through */ } }
    return { error: 'network', network: true };
  }
}

/* ===================== POPUPS ===================== */
let busyN = 0;
function showBusy(text) { busyN++; let el = $('busyRoot'); if (!el) { el = document.createElement('div'); el.id = 'busyRoot'; document.body.appendChild(el); } el.innerHTML = `<div class="wt" role="alert" aria-live="polite"><div class="md"><div class="sp"></div><b>${esc(text)}</b></div></div>`; }
function hideBusy() { busyN = Math.max(0, busyN - 1); if (!busyN) { const el = $('busyRoot'); if (el) el.innerHTML = ''; } }
// Keep the page from scrolling behind a popup (the popup's own text can still scroll).
['touchmove', 'wheel'].forEach(ev => document.addEventListener(ev, e => {
  if (!document.querySelector('.wt, .ov')) return;
  const m = e.target.closest && e.target.closest('.md');
  if (!m || document.querySelector('.wt') || m.scrollHeight <= m.clientHeight) e.preventDefault();
}, { passive: false }));
function modal(o) {
  return new Promise(res => {
    const root = $('modalRoot'), bs = o.buttons || [{ label: t('ok'), v: true }];
    root.innerHTML = `<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true"><h3>${esc(o.title || t('mHeads'))}</h3>${(o.paras || [o.text]).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}${(o.sug || []).map((s, i) => `<button class="sg" data-s="${i}"><span>${esc(s.label)}</span><span>›</span></button>`).join('')}<div class="bt">${bs.map((b, i) => `<button class="${b.g ? 'g' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div></div>`;
    const done = v => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => done(bs[+b.dataset.i].v));
    root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => done({ suggest: o.sug[+b.dataset.s] }));
    const ov = $('ov'); ov.onclick = e => { if (e.target === ov) done(null); };
    const f = root.querySelector('.bt button'); if (f) f.focus();
  });
}
async function info(title, text, sug) {
  const r = await modal({ title, text, sug, buttons: [{ label: t('close'), g: true, v: null }] });
  if (r && r.suggest) await pickSlot(r.suggest.date, r.suggest.slot, true);
}

/* ===================== WEEK + SLOT SELECTION ===================== */
let lastWeekAt = 0;
async function refreshWeek(ms) {
  const r = await call('getWeekAvailability', { excludeToken: st.mode === 'manage' ? st.token : undefined }, ms || 12000);
  if (r && r.days) { st.week = r; lastWeekAt = Date.now(); if (st.screen === 'pickup' && !$('modalRoot').innerHTML && !busyN) render(); }
  return !!(r && r.days);
}
function slotStillOk() {
  if (!st.date || !st.slot) return false;
  const d = dayData(st.date), sd = slotData(st.date, st.slot);
  if (!d || !sd || d.closed) return true;                       // no data to judge with: the server decides
  return !misfitsOf(d, sd, unitsByCap(cartQty())).length;
}
async function pickSlot(dateK, label, skipFresh) {
  if (st.checking) return; st.checking = true; showBusy(t('checking'));
  try { if (!skipFresh || Date.now() - lastWeekAt > 5000) await refreshWeek(8000); } finally { st.checking = false; hideBusy(); }
  if (st.screen === 'pickup') render();   // show the fresh availability behind any popup
  const d = dayData(dateK), sd = slotData(dateK, label);
  if (!d || d.closed) return info(t('mClosed'), t('closedDay'));
  if (!sd) return info(t('mHeads'), t('netErr'));
  st.flash = '';
  const cart = cartQty(), units = unitsByCap(cart), cs = Object.keys(units);
  if (st.mode === 'manage' && st.order && (st.order.lockedOptions || []).some(n => (st.order.items[n] || 0) > 0) && dateK !== st.order.pickupDate)
    return info(t('mLocked'), t('lockedChange', { items: earlyCaps().map(iName).join(', '), phone: phoneNo() }));
  const mf = misfitsOf(d, sd, units);
  if (mf.length) {
    const names = mf.map(iName).join(', '), lc = lockedCaps(d);
    const sg = suggest(units, dateK, label, 2);
    if (mf.length < cs.length) {   // the rest of the order still works here: keep this time without the blocked item(s)
      const onlyLocked = mf.every(c => lc.indexOf(c) >= 0);
      const r = await modal({ title: t('partT'), paras: [onlyLocked ? t('partLock', { i: names, t: cutoffTime() }) : t('partP', { i: names })], sug: sg,
        buttons: [{ label: t('keepWithout', { i: names }), v: 'keep' }, { label: t('other'), g: true, v: null }] });
      if (r === 'keep') { opts().filter(o => mf.indexOf(o.capItem) >= 0).forEach(o => setQ(o.name, 0)); st.date = dateK; st.slot = label; st.gone = false; st.flash = t('removed', { i: names }); render(); }
      else if (r && r.suggest) await pickSlot(r.suggest.date, r.suggest.slot, true);
      return;
    }
    return info(t('fullT'), t('fullP', { i: names }), sg);
  }
  st.date = dateK; st.slot = label; st.gone = false; render();
}

/* ===================== QUANTITY ===================== */
async function changeQty(name, delta) {
  const o = optBy(name), cur = qty(name), n = Math.max(0, Math.min(999, cur + delta));
  if (n === cur) return;
  if (st.mode === 'manage' && st.order && st.date) {

async function placeOrder() {
  if (st.busy) return;
  if (!st.date || !st.slot) return go('pickup');
  if (totalCount() === 0) return info(t('mCheck'), t('needItems'));
  st.busy = true;
  try {
    const ex = await busyCall(t('checking'), 'checkOrderExists', { email: st.email.trim(), phone: st.phone, pickupDate: st.date, pickupTime: st.slot });
    if (ex && ex.found) { const go2 = await modal({ title: t('mMerge'), text: t('mergeMsg'), buttons: [{ label: t('cont'), v: true }, { label: t('goBack'), g: true, v: false }] }); if (!go2) return; }
    for (let attempt = 0; attempt < 2; attempt++) {
      const res = await busyCall(t('placing'), 'submitOrder', { data: { name: st.name.trim(), email: st.email.trim(), phone: st.phone, pickupDate: st.date, pickupTime: st.slot, notes: st.notes, reminder: !!st.reminder, items: itemsPayload() } }, 40000);
      if (res && res.success) { st.result = { kind: 'placed', when: pickTxt(), cart: res.mergedItems || cartQty(), reminder: st.reminder }; clearTimeout(weekTimer); st.screen = 'done'; render(); scrollTo(0, 0); return; }
      const r = await showFailure(res || { network: true });
      if (r === 'retry') continue;
      if (r !== 'moved') afterFailure(res || {});
      return;
    }
  } finally { st.busy = false; }
}
async function saveChanges() {
  if (st.busy) return;
  if (!st.order || !st.order.editable) return info(t('mHeads'), t('closedEdit', { phone: phoneNo() }));
  if (!st.date || !st.slot) return go('pickup');
  if (totalCount() === 0) return info(t('mCheck'), t('needItems'));
  st.busy = true;
  try {
    for (let attempt = 0; attempt < 2; attempt++) {
      const res = await busyCall(t('saving'), 'updateOrder', { token: st.token, data: { pickupDate: st.date, pickupTime: st.slot, notes: st.notes, reminder: !!st.reminder, items: itemsPayload() } }, 40000);
      if (res && res.success) { st.result = { kind: 'updated', when: pickTxt(), cart: cartQty(), reminder: st.reminder }; st.screen = 'done'; render(); scrollTo(0, 0); return; }
      const r = await showFailure(res || { network: true });
      if (r === 'retry') continue;
      if (r !== 'moved') afterFailure(res || {});
      return;
    }
  } finally { st.busy = false; }
}
async function doCancel() {
  if (st.busy) return;
  if (st.order && st.order.canCancel === false) return info(t('mLocked'), t('cantCancel', { phone: phoneNo() }));
  const yes = await modal({ title: t('cancelQ'), text: t('cancelT'), buttons: [{ label: t('yesCancel'), v: true }, { label: t('keep'), g: true, v: false }] });
  if (!yes) return;
  st.busy = true;
  try {
    const res = await busyCall(t('cancelling'), 'cancelOrder', { token: st.token }, 40000);
    if (res && res.success) { st.result = { kind: 'cancelled' }; st.screen = 'done'; render(); scrollTo(0, 0); return; }
    await showFailure(res || { network: true });
  } finally { st.busy = false; }
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lang],[data-go],[data-q],[data-dq],[data-sug],[data-detail],[data-day],[data-slot],[data-act]'); if (!el) return;
  const d = el.dataset;
  if (d.lang) { st.lang = d.lang; return render(); }
  if (d.detail) return go('detail', d.detail);
  if (d.q) return changeQty(d.q, +d.d);
  if (d.dq) return setDraft(d.dq, dq(d.dq) + (+d.d));
  if (d.act === 'addItem') return commitDraft();
  if (d.day) { if (st.date !== d.day) { st.date = d.day; st.slot = null; st.flash = ''; st.gone = false; } return render(); }
  if (d.slot) return pickSlot(st.date, d.slot);
  if (d.sug) { const [dt, sl] = d.sug.split('|'); return pickSlot(dt, sl); }
  if (d.go) return go(d.go);
  if (d.act === 'toReview') { if (!validate()) { render(); const f = document.querySelector('.fld.bad'); if (f) f.scrollIntoView({ block: 'center' }); return info(t('fixT'), t('fixP')); } return go('review'); }
  if (d.act === 'place') return placeOrder();
  if (d.act === 'save') return saveChanges();
  if (d.act === 'cancel') return doCancel();
  if (d.act === 'editTime') return go('pickup');
  if (d.act === 'again') { st.q = {}; st.date = null; st.slot = null; st.notes = ''; st.result = null; st.flash = ''; st.gone = false; st.screen = 'menu'; render(); scrollTo(0, 0); refreshWeek(); scheduleWeek(); }
});
document.addEventListener('change', e => {
  const a = e.target.closest('input[data-dqi]'); if (a) return setDraft(a.dataset.dqi, a.value);
  const b = e.target.closest('input[data-qi]'); if (b) return changeQty(b.dataset.qi, Math.max(0, Math.min(999, Math.floor(Number(b.value) || 0))) - qty(b.dataset.qi));
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[data-dqi],input[data-qi]')) e.target.blur(); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.f; if (!k) return;
  st[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (st.bad[k]) { st.bad[k] = false; const l = e.target.closest('.fld'); if (l) l.classList.remove('bad'); }
});

/* ===================== START ===================== */
let weekTimer = null;
function scheduleWeek() { clearTimeout(weekTimer); weekTimer = setTimeout(async () => { if (st.screen !== 'done' && !document.hidden && !busyN) await refreshWeek(12000); scheduleWeek(); }, 45000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && st.screen !== 'done' && Date.now() - lastWeekAt > 15000) refreshWeek(12000); });
async function start() { await startInner(); }   // menu shows straight away; availability loads in the background
async function startInner() {
  const token = new URLSearchParams(location.search).get('cancel');
  if (token) { st.mode = 'manage'; st.token = token; st.screen = 'loading'; }
  render();
  const [cfg, wk] = await Promise.all([call('getFormConfig'), token ? Promise.resolve(null) : call('getWeekAvailability', {}, 15000)]);
  if (cfg && cfg.options) st.cfg = Object.assign({}, st.cfg, cfg);
  if (token) {
    const o = await call('getOrderForCancel', { token });
    if (!o || !o.found) { st.result = { kind: 'notfound' }; st.screen = 'done'; render(); return; }
    st.order = o; st.name = o.name; st.notes = o.notes || ''; st.reminder = !!o.reminder; st.date = o.pickupDate; st.slot = o.pickupTime; st.q = {};
    Object.keys(o.items || {}).forEach(n => { if (o.items[n] > 0) st.q[n] = o.items[n]; });
    const w = await call('getWeekAvailability', { excludeToken: token }, 15000);
    if (w && w.days) { st.week = w; lastWeekAt = Date.now(); }
    st.screen = 'manage'; render(); scheduleWeek();
    if (!o.editable) info(t('mHeads'), t('closedEdit', { phone: phoneNo() }));
    return;
  }
  if (wk && wk.days) { st.week = wk; lastWeekAt = Date.now(); }
  else if (!(cfg && cfg.options)) { render(); const r = await modal({ title: t('mNet'), text: t('netErr'), buttons: [{ label: t('retry'), v: 'retry' }, { label: t('close'), g: true, v: null }] }); if (r === 'retry') return startInner(); }
  else await refreshWeek(15000);
  render(); scheduleWeek();
}
start();
</script>
